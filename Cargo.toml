[package]
name = "tinybrain"
version = "0.1.0"
edition = "2024"
description = "A tiny memory for pentesters and their agents, classified by Jev or strands-decider"
license = "MIT"
repository = "https://github.com/rainmana/rustybrain"
keywords = ["security", "pentest", "mcp", "memory", "agents"]
categories = ["command-line-utilities", "database"]

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = { version = "2", features = ["json"] }
